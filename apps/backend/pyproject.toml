[project]
name = "neraca-backend"
version = "0.1.0"
description = "NERACA: groundwater accounts, inspection leads, and pipe priority API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neraca"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "httpx2>=2.16.2",
    "mypy>=1.11.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented pattern.

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["tests", "migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
